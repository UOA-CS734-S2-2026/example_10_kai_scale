server {
  listen 80;
  root /usr/share/nginx/html;

  # Anything under /api/ goes to the "api" service on the Compose network.
  # "api" resolves because compose.yaml names the service api.
  #
  # Week 10: with two replicas, "api" resolves to two addresses, and nginx
  # takes them in turn (round robin). It looks the name up when it starts, so
  # after the replicas change, restart web: ./demo.sh run does.
  location /api/ {
    proxy_pass http://api:3734/;
  }

  # Everything else is the dashboard itself. Unknown paths still get
  # index.html, so the app's own routing can take over.
  location / {
    try_files $uri /index.html;
  }
}
