# The gateway: one front door on port 3734, in front of every api replica.

# Step 5: rate-limit state, one entry per client address. nginx's limit_req
# works in the leaky-bucket style: requests are let through at rate=1r/s, and
# burst=3 allows up to 3 extra at once (nodelay serves them immediately).
# Anything beyond that gets 429 Too Many Requests.
limit_req_zone $binary_remote_addr zone=eat:10m rate=1r/s;

# Load balancing. Docker's DNS answers "api" with one address per replica,
# and nginx takes them in turn (round robin). nginx looks the name up when it
# starts, so after the replicas change, restart it: ./demo.sh run does.
upstream api {
  server api:3734;
}

server {
  listen 80;

  # Step 5: eatPortion, the gap Week 9 left open. Limited per caller.
  location ~ ^/events/[^/]+/eat$ {
    limit_req zone=eat burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many;
    proxy_pass http://api;
  }

  location @too_many {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":"Too many requests. Wait a second and try again."}';
  }

  # Everything else (the rest of REST, and /graphql) goes straight through.
  location / {
    proxy_pass http://api;
  }
}
