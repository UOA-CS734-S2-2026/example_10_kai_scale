# Step 6: somewhere to keep copies of the public feed.
proxy_cache_path /var/cache/nginx/kai keys_zone=feed:10m max_size=50m inactive=1m;

# Step 5: rate-limit state, one entry per client address. nginx's limit_req
# works in the leaky-bucket style: requests are let through at rate=1r/s, and
# burst=3 allows up to 3 extra at once (nodelay serves them immediately).
# Anything beyond that gets 429 Too Many Requests.
limit_req_zone $binary_remote_addr zone=eat:10m rate=1r/s;

server {
  listen 80;
  root /usr/share/nginx/html;

  # Step 6: the public feed, answered from the cache for as long as the
  # server's Cache-Control allows (2 seconds). X-Cache-Status shows MISS (went
  # to the api) or HIT (did not). proxy_cache_lock: when the copy expires and
  # many requests arrive at once, only one goes to the api.
  location = /api/events {
    proxy_cache feed;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://api:3734/events;
  }

  # Step 5: eatPortion, the gap Week 9 left open. Limited per caller.
  location ~ ^/api/events/[^/]+/eat$ {
    limit_req zone=eat burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3734;
  }

  location @too_many {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":"Too many requests. Wait a second and try again."}';
  }

  # Anything under /api/ goes to the "api" service on the Compose network.
  # "api" resolves because compose.yaml names the service api.
  #
  # Week 10: with two replicas, "api" resolves to two addresses, and nginx
  # takes them in turn (round robin). It looks the name up when it starts, so
  # after the replicas change, restart web: ./demo.sh run does.
  location /api/ {
    proxy_pass http://api:3734/;
  }

  # Everything else is the dashboard itself. Unknown paths still get
  # index.html, so the app's own routing can take over.
  location / {
    try_files $uri /index.html;
  }
}
