server {
  listen 80;
  root /usr/share/nginx/html;

  # Anything under /api/ goes to the "api" service on the Compose network.
  # "api" resolves because compose.yaml names the service api.
  location /api/ {
    proxy_pass http://api:3734/;
  }

  # Everything else is the dashboard itself. Unknown paths still get
  # index.html, so the app's own routing can take over.
  location / {
    try_files $uri /index.html;
  }
}
